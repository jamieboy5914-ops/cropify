<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detect - Cropify</title>
  <link rel="icon" type="image/x-icon" href="/static/assets/aboutfav.png">
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    .wrap{min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;
      padding:40px 16px;background:linear-gradient(rgba(9,26,15,.6),rgba(9,26,15,.75)),
      url('/static/assets/BGIMG2.jpg') center/cover fixed}
    .card{width:100%;max-width:560px;text-align:center}
    .card h1{font-size:clamp(24px,5vw,30px);margin-bottom:4px}
    .card .sub{color:var(--muted);margin-bottom:28px;font-size:15px}
    .drop{position:relative;z-index:1;display:block;border:2px dashed var(--ring);border-radius:14px;padding:34px 18px;cursor:pointer;
      transition:.2s;background:#f7fbf8}
    .drop:hover{border-color:var(--green);background:var(--soft)}
    .drop svg{width:46px;height:46px;fill:var(--green);margin:0 auto 10px}
    .drop p{margin:4px 0 0;color:#3c5a45;font-size:14px}
    #fileName{margin-top:14px;color:var(--green-dark);font-weight:600;font-size:14px;min-height:18px}
    input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;z-index:-1}
    #preview{max-width:100%;max-height:230px;border-radius:12px;margin-top:18px;display:none;margin-left:auto;margin-right:auto}
    .btn-primary{width:100%;margin-top:22px}
    /* progress overlay */
    .overlay{position:fixed;inset:0;background:rgba(9,26,15,.9);display:none;
      flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#eafbee;padding:24px}
    .overlay.show{display:flex}
    .overlay img.spinleaf{width:60px;height:60px;animation:spin 1.4s linear infinite;margin-bottom:22px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bartrack{width:min(360px,80vw);height:10px;background:rgba(255,255,255,.18);border-radius:6px;overflow:hidden}
    .barfill{height:100%;width:0;background:var(--green);border-radius:6px;transition:width .3s ease}
    .overlay p{margin-top:16px;font-size:15px}
    .tags{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .tag{background:var(--soft);color:var(--green-dark);font-size:12px;padding:5px 12px;border-radius:20px}
  </style>
</head>
<body>
    <nav class="nav">
    <a class="brand" href="/"><img src="/static/assets/LOGO.png" alt="Cropify"><span>Cropify</span></a>
    <button class="burger" onclick="document.getElementById('navlinks').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <div class="links" id="navlinks">
      <a href="/">Home</a>
      <a href="/prediction">Detect</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/aboutapp">About</a>
    </div>
  </nav>
  <div class="wrap">
    <div class="card">
      <h1>Crop Disease Detection</h1>
      <p class="sub">Upload a cotton leaf photograph for analysis</p>
      <form method="POST" enctype="multipart/form-data" action="/prediction" id="predForm">
        <label class="drop" for="imageInput">
          <svg viewBox="0 0 24 24"><path d="M19 13v6H5v-6H3v8h18v-8h-2zM11 4.83V15h2V4.83l3.59 3.58L18 7l-6-6-6 6 1.41 1.41L11 4.83z"/></svg>
          <p><strong>Click to choose a leaf image</strong></p>
          <p>PNG or JPG</p>
        </label>
        <input type="file" id="imageInput" name="file" accept="image/*" required>
        <div id="fileName"></div>
        <img id="preview" alt="preview">
        <button type="submit" class="btn-primary">Predict Crop Disease</button>
      </form>
      <div class="tags">
        <span class="tag">Bacterial Blight</span><span class="tag">Curl Virus</span>
        <span class="tag">Healthy Leaf</span><span class="tag">Herbicide Damage</span>
        <span class="tag">Leaf Hopper Jassids</span><span class="tag">Leaf Redding</span>
        <span class="tag">Leaf Variegation</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <img class="spinleaf" src="/static/assets/aboutfav.png" alt="">
    <div class="bartrack"><div class="barfill" id="barfill"></div></div>
    <p id="progressText">Analysing leaf... 0%</p>
  </div>

  <script src="/static/script.js"></script>
  <script>
    const input=document.getElementById('imageInput');
    const fileName=document.getElementById('fileName');
    const preview=document.getElementById('preview');
    input.addEventListener('change',()=>{
      if(input.files.length){
        fileName.textContent=input.files[0].name;
        const r=new FileReader();
        r.onload=e=>{preview.src=e.target.result;preview.style.display='block';};
        r.readAsDataURL(input.files[0]);
      }
    });
    // progress bar on submit. It animates while the server does the real work,
    // then the page navigates to the result when the response arrives.
    document.getElementById('predForm').addEventListener('submit',()=>{
      const overlay=document.getElementById('overlay');
      const fill=document.getElementById('barfill');
      const txt=document.getElementById('progressText');
      overlay.classList.add('show');
      let p=0;
      const timer=setInterval(()=>{
        p+=Math.random()*12;
        if(p>=95){p=95;clearInterval(timer);}
        fill.style.width=p+'%';
        txt.textContent='Analysing leaf... '+Math.floor(p)+'%';
      },220);
    });
  </script>
</body>
</html>
