<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="/static/CSS/lsstyle.css" rel="stylesheet">
    <title>Login Form</title>
    <style>

    </style>
</head>
<body>
<div class="container-fluid">
    <form action="/login" method="post" class="mx-auto" style="max-width: 400px;">
        <h4 class="text-center">Login</h4>
        <div class="mb-3 mt-5">
            <label for="exampleInputEmail1" class="form-label">Email</label>
            <input type="email" class="form-control" id="exampleInputEmail1" name="username" aria-describedby="emailHelp" required>
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1" name="password" required>
            <div id="emailHelp" class="form-text mt-3">Forgot password?</div>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Login</button>
        <div class="mt-3 p-3" id="signup" >
            <h5 class="text-center" >Not having credentials? Sign up here</h5>
            <button type="button" class="btn btn-secondary d-block mx-auto" onclick="redirectToSignup()">Sign Up</button>
        </div>
    </form>
</div>

<!-- Optional: Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

<!-- Custom Script to handle redirection -->
<script>
    function redirectToSignup() {
        window.location.href = '/signup';
    }
</script>
</body>
</html>
